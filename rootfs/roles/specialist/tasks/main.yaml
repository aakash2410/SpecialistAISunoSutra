---
# The Specialist — on-device embedding model + baked DIKSHA index.
#
# The application code and the baked corpus index ship inside the python tree
# (pocketinfer/specialist/corpus), so the `app` role's rsync already places them
# on the device. This role just makes sure the neural embedding model is present
# and pre-fetched so run time stays fully offline. Run it AFTER the `app` role.
#
# sentence-transformers is declared in python/requirements.txt and installed by
# the `app` role against the torch from the JetPack SDK base image. If that
# install is skipped or fails, the embedder falls back to a built-in TF-IDF
# model and the device still works (lower retrieval quality) — so these tasks
# are best-effort and do not fail the play.

- name: Confirm the baked DIKSHA index shipped with the app code
  tags: [always]
  ansible.builtin.stat:
    path: ~/pocket-infer-sw/python/pocketinfer/specialist/corpus/diksha_g7_science/index/embeddings.npy
  register: specialist_index

- name: Warn if the DIKSHA index is missing
  tags: [always]
  ansible.builtin.debug:
    msg: >-
      DIKSHA index not found. Bake it off-device with
      `python ingest/build_index.py` before provisioning, then re-run the app role.
  when: not specialist_index.stat.exists

- name: Pre-fetch the embedding model so run time is fully offline
  tags: [always]
  # Embed.update() downloads/caches the sentence-transformers model; it is
  # idempotent and returns success (with a warning) if the dep is unavailable.
  ansible.builtin.command:
    cmd: >-
      python3 -c "from pocketinfer.models.embed import Embed;
      print(Embed.update({'model_name': 'intfloat/multilingual-e5-small'}))"
  register: specialist_embed_prefetch
  changed_when: false
  failed_when: false

- name: Report embedding model pre-fetch result
  tags: [always]
  ansible.builtin.debug:
    var: specialist_embed_prefetch.stdout
