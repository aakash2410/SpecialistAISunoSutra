---
# Install The Specialist on a Jetson running JetPack 6. It needs nothing from the
# upstream Suno Sutra base install, and it leaves the desktop, hostname, kernel and
# existing packages as they are. Physical hardware is not part of this role yet.

# ------------------------------------------------------------------- preflight
- name: Read the JetPack release
  tags: [always]
  ansible.builtin.slurp:
    src: /etc/nv_tegra_release
  register: specialist_release

- name: Measure free disk space
  tags: [always]
  ansible.builtin.shell: df --output=avail -BG / | tail -1 | tr -dc 0-9
  register: specialist_free_gb
  changed_when: false

- name: Stop early on an unsupported device
  tags: [always]
  ansible.builtin.assert:
    that:
      - "'R36' in (specialist_release.content | b64decode)"
      - specialist_free_gb.stdout | int >= specialist_min_free_gb
    fail_msg: >-
      The Specialist needs JetPack 6 (R36) and {{ specialist_min_free_gb }} GB free.
      This device has {{ specialist_free_gb.stdout }} GB free.

# --------------------------------------------------------------- system packages
# Only what the device runs or the install itself needs, without recommended extras.
# Nothing is removed: JetPack and the Suno Sutra base install may already hold more.
#   python3-venv          the two Python environments (pip comes with each one)
#   python3-setuptools    Ansible's pip module needs it on the system Python
#   unzip, git            unpack Bhashini, fetch Flite
#   build-essential       build Flite, and any Bhashini package that has no wheel
#   wget, perl            Flite's build and voice download
#   libomp5-14            OpenMP for the CUDA build of CTranslate2
#   libsndfile1           audio files in Bhashini
#   curl                  the boot check and the Ollama installer
#   ffmpeg                slower replay ("slower", "धीरे बोलो")
#   alsa-utils            arecord and aplay, for the microphone and speaker
#   v4l-utils             the camera's autofocus rule
#   tesseract-ocr, packs  reading page photos
- name: Install system packages
  tags: [system]
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    pkg: "{{ ['python3-venv', 'python3-setuptools', 'unzip', 'git', 'build-essential', 'wget', 'perl',
              'libomp5-14', 'libsndfile1', 'curl', 'ffmpeg', 'alsa-utils', 'v4l-utils', 'tesseract-ocr']
              + (specialist_ocr_packs | map('regex_replace', '^', 'tesseract-ocr-') | list) }}"

# The downloaded .deb files are not needed once installed.
- name: Clear apt's download cache
  tags: [system]
  become: true
  ansible.builtin.command: apt-get clean
  changed_when: false

- name: Create the install folder
  tags: [system]
  become: true
  ansible.builtin.file:
    path: "{{ specialist_root }}"
    state: directory
    owner: "{{ specialist_user }}"
    mode: "0755"

- name: Create the working folders
  tags: [system]
  ansible.builtin.file:
    path: "{{ specialist_root }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [app, corpus, models, tools]

# ---------------------------------------------------------------------- assets
- name: Copy the asset fetcher
  tags: [assets]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../payload/tools/"
    dest: "{{ specialist_root }}/tools/"
    mode: "0755"

- name: Fetch Bhashini and the CUDA build of CTranslate2 from Git LFS (resumes, checks SHA-256)
  tags: [assets]
  ansible.builtin.command:
    cmd: >-
      python3 {{ specialist_root }}/tools/fetch_assets.py
      --manifest {{ specialist_root }}/tools/assets.json
      --dest {{ specialist_assets_dir }}
  async: 86400
  poll: 60
  register: specialist_fetch
  changed_when: "'verified' in specialist_fetch.stdout"

- name: Install the CUDA build of CTranslate2
  tags: [assets]
  become: true
  ansible.builtin.apt:
    deb: "{{ specialist_assets_dir }}/ctranslate2-0.1.1-Linux.deb"
    state: present
    install_recommends: false

# ---------------------------------------------------------------------- Ollama
- name: Check for Ollama
  tags: [ollama]
  ansible.builtin.stat:
    path: /usr/local/bin/ollama
  register: specialist_ollama_bin

- name: Install Ollama with the official script
  tags: [ollama]
  become: true
  ansible.builtin.shell: curl -fsSL https://ollama.com/install.sh | sh
  when: not specialist_ollama_bin.stat.exists

- name: Check for the Ollama service
  tags: [ollama]
  ansible.builtin.stat:
    path: /etc/systemd/system/ollama.service
  register: specialist_ollama_unit

- name: Create the Ollama user
  tags: [ollama]
  become: true
  ansible.builtin.user:
    name: ollama
    system: true
    shell: /bin/false
    home: /usr/share/ollama
    groups: [render, video]
    append: true
  when: not specialist_ollama_unit.stat.exists

- name: Install the Ollama service
  tags: [ollama]
  become: true
  ansible.builtin.template:
    src: ollama.service.j2
    dest: /etc/systemd/system/ollama.service
    mode: "0644"
  when: not specialist_ollama_unit.stat.exists

# Memory settings (specialist_ollama_env). Also tagged boot, so the usual
# --tags app,boot,verify update applies them.
- name: Create the Ollama settings folder
  tags: [ollama, boot]
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: "0755"

- name: Install the Ollama memory settings
  tags: [ollama, boot]
  become: true
  ansible.builtin.template:
    src: ollama-specialist.conf.j2
    dest: /etc/systemd/system/ollama.service.d/specialist.conf
    mode: "0644"
  register: specialist_ollama_settings

# Restarting unloads the answer model. The voice loop loads it again when it starts.
- name: Restart Ollama with the new settings
  tags: [ollama, boot]
  become: true
  ansible.builtin.systemd:
    name: ollama
    state: restarted
    daemon_reload: true
  when: specialist_ollama_settings is changed

- name: Start Ollama
  tags: [ollama]
  become: true
  ansible.builtin.systemd:
    name: ollama
    state: started
    enabled: true
    daemon_reload: true

- name: List the installed answer models
  tags: [ollama]
  ansible.builtin.command: /usr/local/bin/ollama list
  register: specialist_ollama_models
  changed_when: false
  retries: 10
  delay: 3
  until: specialist_ollama_models.rc == 0

- name: Pull the answer model
  tags: [ollama]
  ansible.builtin.command: /usr/local/bin/ollama pull {{ specialist_llm_model }}
  when: specialist_llm_model not in specialist_ollama_models.stdout

# Opt-in: -e specialist_prune_ollama_models=true. Never touches specialist_llm_model.
- name: Remove the other Ollama models
  tags: [ollama]
  ansible.builtin.command: /usr/local/bin/ollama rm {{ item }}
  loop: "{{ specialist_ollama_models.stdout_lines[1:] | select | map('split') | map('first') | list }}"
  when:
    - specialist_prune_ollama_models | bool
    - item not in [specialist_llm_model, specialist_llm_model ~ ':latest']

# -------------------------------------------------------------------- Bhashini
- name: Unpack the Bhashini models
  tags: [bhashini]
  ansible.builtin.unarchive:
    src: "{{ specialist_assets_dir }}/bhashini_models.zip"
    dest: "{{ specialist_root }}"
    remote_src: true
    creates: "{{ specialist_bhashini_dir }}/main.py"

# Bhashini holds 4.4 GB once loaded, which leaves too little for the rest of the
# pipeline on an 8 GB Jetson, so Tamil speech input and Indic-to-Indic translation go.
# Both remain in the downloaded archive if a larger device wants them back.
- name: Remove the Bhashini models this build does not use
  tags: [bhashini]
  ansible.builtin.file:
    path: "{{ specialist_bhashini_dir }}/{{ item }}"
    state: absent
  loop:
    - asr/checkpoints/ta-conformer.onnx
    - asr/checkpoints/ta-conformer.onnx.data
    - nmt/checkpoints/indic-indic

- name: Stop Bhashini loading Tamil speech input
  tags: [bhashini]
  ansible.builtin.replace:
    path: "{{ specialist_bhashini_dir }}/asr/infer.py"
    regexp: '^ *"ta": ort\.InferenceSession\(\n *f"\{checkpoint_dir\}/ta-conformer\.onnx"\n *\),\n'
    replace: ""

# The archive's asr/infer.py lists only 88 of the model's 128 tokens, so it silently drops
# common sounds such as the letters in "paudhe" and "mujhe". This is the model's full list.
- name: Give Hindi speech input its full vocabulary
  tags: [bhashini]
  ansible.builtin.replace:
    path: "{{ specialist_bhashini_dir }}/asr/infer.py"
    regexp: 'self\.VOCAB_HI = \[[^\]]*\]'
    replace: 'self.VOCAB_HI = ["<unk>", "ा", "े", "र", "ी", "न", "ि", "ल", "क", "्", "▁", "स", "म", "त", "▁स", "ो", "▁द", "▁क", "ट", "ं", "▁अ", "प", "▁ब", "▁प", "व", "ु", "य", "▁है", "▁म", "ह", "▁ज", "▁व", "▁आ", "ग", "द", "▁ह", "ू", "श", "्र", "ै", "ब", "्य", "▁इ", "ज", "ड", "▁न", "र्", "▁के", "▁ल", "▁में", "च", "ए", "ज़", "▁उ", "ख", "▁र", "▁फ", "ों", "ॉ", "भ", "▁ग", "ंग", "ता", "ने", "▁और", "▁का", "ाइ", "्ट", "▁प्र", "▁को", "▁की", "▁कर", "▁हो", "▁से", "▁च", "ध", "▁हैं", "ई", "्स", "▁तो", "▁त", "▁थ", "फ", "थ", "स्ट", "▁कि", "न्ट", "▁भी", "▁ड", "▁वि", "▁नहीं", "▁रह", "▁टू", "▁एक", "छ", "▁श", "ड़", "ण", "ौ", "ष", "ँ", "उ", "इ", "ठ", "अ", "़", "ओ", "ऑ", "घ", "ढ", "झ", "आ", "ृ", "ऊ", "ञ", "ः", "ऐ", "औ", "ऋ", "ॅ", "ङ", "ऱ", "ॆ", "ऩ", "ॐ", "ऍ", "ॊ", "ॠ"]'

# nmt/infer.py counts "en" as an Indic language, so every request went to the
# Indic-to-Indic model and the two dedicated English models sat unused. Without this,
# removing that model makes all translation fail.
- name: Send English translation to the dedicated models
  tags: [bhashini]
  ansible.builtin.replace:
    path: "{{ specialist_bhashini_dir }}/nmt/infer.py"
    regexp: '^INDIC_LANGUAGES = set\(iso_to_flores\.keys\(\)\)$'
    replace: 'INDIC_LANGUAGES = set(iso_to_flores.keys()) - {"en"}'

# On the CPU this CTranslate2 build only runs float32, which took about 6.5 s for a short
# sentence and held far more memory. On the GPU the same sentence takes about 0.2 s.
- name: Run translation on the GPU
  tags: [bhashini]
  ansible.builtin.replace:
    path: "{{ specialist_bhashini_dir }}/nmt/infer.py"
    regexp: 'device="cpu",'
    replace: 'device="cuda",'

# The wheel goes in first so the requirements below keep the CUDA build rather than
# replacing it with a CPU build.
- name: Install CTranslate2 into the Bhashini environment
  tags: [bhashini]
  ansible.builtin.pip:
    name: "{{ specialist_assets_dir }}/ctranslate2-4.6.3-cp310-cp310-linux_aarch64.whl"
    extra_args: --no-cache-dir
    virtualenv: "{{ specialist_bhashini_dir }}/venv"
    virtualenv_command: python3 -m venv

# Bhashini only uses PyTorch on the CPU, in asr/infer.py. The CUDA builds need NVIDIA
# libraries that are not in JetPack's package sources, so use the CPU build. It goes
# in first so the requirements below keep it. The import check also repairs an
# environment that already holds a CUDA build that cannot load.
- name: Install PyTorch for CPU into the Bhashini environment
  tags: [bhashini]
  ansible.builtin.shell: >-
    {{ specialist_bhashini_dir }}/venv/bin/python -c "import torch" 2>/dev/null
    && echo present
    || {{ specialist_bhashini_dir }}/venv/bin/pip install --no-cache-dir --force-reinstall
    --index-url {{ specialist_torch_cpu_index }} torch
  register: specialist_torch_install
  changed_when: "'present' not in specialist_torch_install.stdout"

- name: Install the Bhashini Python packages
  tags: [bhashini]
  ansible.builtin.pip:
    requirements: "{{ specialist_bhashini_dir }}/requirements.txt"
    extra_args: "--no-cache-dir --index-url={{ specialist_torch_index }}"
    virtualenv: "{{ specialist_bhashini_dir }}/venv"

- name: Keep NumPy compatible with the Bhashini packages
  tags: [bhashini]
  ansible.builtin.pip:
    name: numpy<2
    extra_args: "--no-cache-dir --index-url={{ specialist_torch_index }}"
    virtualenv: "{{ specialist_bhashini_dir }}/venv"

# Translation splits text with NLTK, whose data is not in the Bhashini archive.
- name: Download the NLTK sentence data
  tags: [bhashini]
  ansible.builtin.command:
    cmd: >-
      {{ specialist_bhashini_dir }}/venv/bin/python -m nltk.downloader
      -d {{ specialist_bhashini_dir }}/venv/nltk_data punkt punkt_tab
    creates: "{{ specialist_bhashini_dir }}/venv/nltk_data/tokenizers/punkt_tab"

- name: Download the Flite speech engine
  tags: [bhashini]
  ansible.builtin.git:
    repo: https://github.com/festvox/flite
    dest: "{{ specialist_bhashini_dir }}/tts/flite"
    depth: 1
    update: false

- name: Build Flite
  tags: [bhashini]
  ansible.builtin.shell: ./configure && make
  args:
    chdir: "{{ specialist_bhashini_dir }}/tts/flite"
    creates: "{{ specialist_bhashini_dir }}/tts/flite/bin/flite"

- name: Download the default voices
  tags: [bhashini]
  ansible.builtin.command: make get_voices
  args:
    chdir: "{{ specialist_bhashini_dir }}/tts/flite"
    creates: "{{ specialist_bhashini_dir }}/tts/flite/voices/cmu_us_aew.flitevox"

- name: Download the Indic voices
  tags: [bhashini]
  ansible.builtin.command: ./bin/get_voices indic_voices
  args:
    chdir: "{{ specialist_bhashini_dir }}/tts/flite"
    creates: "{{ specialist_bhashini_dir }}/tts/flite/voices/cmu_indic_hin_ab.flitevox"

# Also tagged boot, so a change to its memory settings applies with the usual
# --tags app,boot,verify update. "Start Bhashini" below restarts it in a bhashini run,
# and "Restart Bhashini with the new settings" in a boot run.
- name: Install the Bhashini service
  tags: [bhashini, boot]
  become: true
  ansible.builtin.template:
    src: bhashini_models.service.j2
    dest: /etc/systemd/system/bhashini_models.service
    mode: "0644"
  register: specialist_bhashini_unit

- name: Start Bhashini
  tags: [bhashini]
  become: true
  ansible.builtin.systemd:
    name: bhashini_models
    state: restarted
    enabled: true
    daemon_reload: true
  changed_when: false

# systemd reports a successful start even if the service dies straight after.
- name: Wait for Bhashini to answer
  tags: [bhashini]
  ansible.builtin.uri:
    url: http://127.0.0.1:11400/health
  register: specialist_bhashini_health
  retries: 40
  delay: 5
  until: specialist_bhashini_health.status == 200

- name: Translate in both directions
  tags: [bhashini]
  ansible.builtin.uri:
    url: http://127.0.0.1:11400/nmt
    method: POST
    body_format: json
    body: "{{ item }}"
    timeout: 120
  loop:
    - {text: "Oxygen is released.", src_lang: en, tgt_lang: hi}
    - {text: "प्रकाश संश्लेषण क्या है?", src_lang: hi, tgt_lang: en}
  loop_control:
    label: "{{ item.src_lang }} to {{ item.tgt_lang }}"

# ------------------------------------------------------------------------- app
- name: Copy the Python requirements
  tags: [app]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements-specialist.txt"
    dest: "{{ specialist_root }}/requirements-specialist.txt"
    mode: "0644"

# Its own environment, without the system's packages, so the CPU build of onnxruntime is
# used rather than any GPU build installed system-wide. No download cache is kept.
- name: Install the Specialist Python packages
  tags: [app]
  ansible.builtin.pip:
    requirements: "{{ specialist_root }}/requirements-specialist.txt"
    extra_args: --no-cache-dir
    virtualenv: "{{ specialist_venv }}"
    virtualenv_command: python3 -m venv

- name: Install the pipeline code
  tags: [app]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../payload/app/"
    dest: "{{ specialist_root }}/app/"
    mode: "0644"

- name: Install the embedding model, answer verifier and safety model
  tags: [app]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../payload/models/"
    dest: "{{ specialist_root }}/models/"
    mode: "0644"

# Only download here. Loading it would need a compute type this CTranslate2 build may not run.
- name: Download the English speech model
  tags: [app]
  ansible.builtin.command:
    cmd: >-
      {{ specialist_venv }}/bin/python -c "from faster_whisper import download_model;
      download_model('{{ specialist_whisper_model }}', cache_dir='{{ specialist_root }}/models/whisper')"
    creates: "{{ specialist_root }}/models/whisper/models--Systran--faster-whisper-{{ specialist_whisper_model }}"

# Models left by an earlier install are removed, so the code cannot load an old file and
# the disk space comes back. embed.py, for one, would load a leftover model.onnx before
# the shipped model_quantized.onnx. Each step checks what is in place before it removes
# anything, and the folders in specialist_models_in_use are never removed.
# On this computer, in the module. (The fileglob lookup cannot match a wildcard folder.)
- name: List the model files this module ships
  tags: [app]
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../payload/models"
    recurse: true
    depth: 2
    hidden: true
  register: specialist_payload_models

- name: List the models this module ships
  tags: [app]
  ansible.builtin.set_fact:
    specialist_shipped_model_files: "{{ specialist_shipped_model_files }}"
    specialist_shipped_models: >-
      {{ specialist_shipped_model_files | select('search', '\.onnx$')
         | map('dirname') | unique | list }}
  vars:
    specialist_shipped_model_files: >-
      {{ specialist_payload_models.files | map(attribute='path')
         | map('relpath', playbook_dir ~ '/../payload/models')
         | select('search', '^[^/]+/[^/]+$') | list }}

- name: Find installed model folders
  tags: [app]
  ansible.builtin.find:
    paths: "{{ specialist_root }}/models"
    file_type: directory
    hidden: true
  register: specialist_installed_models

- name: Remove model folders the pipeline does not load
  tags: [app]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ specialist_installed_models.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - specialist_shipped_models | length > 0
    - (item.path | basename) not in specialist_shipped_models
    - (item.path | basename) not in specialist_models_in_use

# Top level of each shipped folder only. Subfolders are left alone.
- name: Find the files in the shipped model folders
  tags: [app]
  ansible.builtin.find:
    paths: "{{ specialist_shipped_models | map('regex_replace', '^', specialist_root ~ '/models/') | list }}"
    hidden: true
  register: specialist_installed_model_files
  when: specialist_shipped_models | length > 0

- name: Remove model files the module does not ship
  tags: [app]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ specialist_installed_model_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | relpath(specialist_root ~ '/models') }}"
  when:
    - specialist_shipped_model_files | length > 0
    - (item.path | relpath(specialist_root ~ '/models')) not in specialist_shipped_model_files

- name: Check the English speech model is in place
  tags: [app]
  ansible.builtin.stat:
    path: "{{ specialist_root }}/models/whisper/models--Systran--faster-whisper-{{ specialist_whisper_model }}/snapshots"
  register: specialist_whisper_current

- name: Find installed English speech models
  tags: [app]
  ansible.builtin.find:
    paths: ["{{ specialist_root }}/models/whisper", "{{ specialist_root }}/models/whisper/.locks"]
    patterns: "models--*"
    file_type: directory
    hidden: true
  register: specialist_installed_whisper

- name: Remove English speech models other than {{ specialist_whisper_model }}
  tags: [app]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ specialist_installed_whisper.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - specialist_whisper_current.stat.exists
    - (item.path | basename) != 'models--Systran--faster-whisper-' ~ specialist_whisper_model

- name: Install the specialist command
  tags: [app]
  become: true
  ansible.builtin.template:
    src: specialist-voice.sh.j2
    dest: /usr/local/bin/specialist-voice
    mode: "0755"

# ------------------------------------------------------------------------ boot
# Applied at every boot, because these settings do not survive a reboot on their own.
- name: Install the hardware settings
  tags: [boot, app]
  become: true
  ansible.builtin.template:
    src: specialist.env.j2
    dest: /etc/default/specialist
    mode: "0644"

- name: Install the camera rules
  tags: [boot]
  become: true
  ansible.builtin.template:
    src: 99-specialist-devices.rules.j2
    dest: /etc/udev/rules.d/99-specialist-devices.rules
    mode: "0644"

- name: Apply the camera rules
  tags: [boot]
  become: true
  ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger --action=add --subsystem-match=usb --subsystem-match=video4linux

- name: Install the boot check
  tags: [boot]
  become: true
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop: [specialist-usb-power, specialist-boot-check]

- name: Install the boot check service
  tags: [boot]
  become: true
  ansible.builtin.template:
    src: specialist-boot-check.service.j2
    dest: /etc/systemd/system/specialist-boot-check.service
    mode: "0644"

- name: Run the boot check at every boot
  tags: [boot]
  become: true
  ansible.builtin.systemd:
    name: specialist-boot-check
    enabled: true
    daemon_reload: true

- name: Install the GPIO tools, for a touch sensor as the talk button
  tags: [boot]
  become: true
  ansible.builtin.apt:
    pkg: gpiod
    install_recommends: false

- name: List the groups that give access to keys and GPIO
  tags: [boot]
  ansible.builtin.getent:
    database: group

- name: Let the user read the talk button
  tags: [boot]
  become: true
  ansible.builtin.user:
    name: "{{ specialist_user }}"
    groups: "{{ ['input', 'audio', 'gpio'] | select('in', ansible_facts.getent_group) | list }}"
    append: true

- name: Install the voice loop service
  tags: [boot]
  become: true
  ansible.builtin.template:
    src: specialist-voice.service.j2
    dest: /etc/systemd/system/specialist-voice.service
    mode: "0644"

# Opt-in: -e specialist_headless=true. Applies from the next reboot, so it never closes a
# desktop session that is open now. With it off, the role leaves the boot target alone.
- name: Read the boot target
  tags: [boot]
  ansible.builtin.command: systemctl get-default
  register: specialist_boot_target
  changed_when: false

- name: Boot to the text console instead of the desktop
  tags: [boot]
  become: true
  ansible.builtin.command: systemctl set-default multi-user.target
  when:
    - specialist_headless | bool
    - specialist_boot_target.stdout != 'multi-user.target'

- name: Restart Bhashini with the new settings
  tags: [boot]
  become: true
  ansible.builtin.systemd:
    name: bhashini_models
    state: restarted
    daemon_reload: true
  # Skipped when this run's bhashini steps already restarted it.
  when:
    - specialist_bhashini_unit is changed
    - specialist_bhashini_health is not defined
  register: specialist_bhashini_restart

- name: Wait for Bhashini to answer again
  tags: [boot]
  ansible.builtin.uri:
    url: http://127.0.0.1:11400/health
  register: specialist_bhashini_back
  retries: 40
  delay: 5
  until: specialist_bhashini_back.status == 200
  when: specialist_bhashini_restart is changed

# Restarted so a reinstall runs the new code and settings.
- name: Start the voice loop at boot
  tags: [boot]
  become: true
  ansible.builtin.systemd:
    name: specialist-voice
    enabled: "{{ specialist_voice_autostart | bool }}"
    state: "{{ 'restarted' if specialist_voice_autostart | bool else 'stopped' }}"
    daemon_reload: true

# --------------------------------------------------------------------- content
# Content is separate from code, so the syllabus can change on its own: --tags content
- name: Install the DIKSHA index
  tags: [content]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../payload/corpus/"
    dest: "{{ specialist_root }}/corpus/"
    mode: "0644"

# The teacher's everyday examples (see python/pocketinfer/specialist/teacher_examples.py).
# The blank template goes in only if there is no file yet, so a teacher's filled-in file
# is never overwritten by a reinstall.
- name: Install the blank teacher examples file
  tags: [content, app, examples]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../payload/teacher_examples.txt"
    dest: "{{ specialist_root }}/teacher_examples.txt"
    mode: "0644"
    force: false

# A file a teacher filled in and sent back: -e specialist_teacher_examples=/path/to/file.txt
- name: Install the teacher's filled-in examples
  tags: [content, app, examples]
  ansible.builtin.copy:
    src: "{{ specialist_teacher_examples }}"
    dest: "{{ specialist_root }}/teacher_examples.txt"
    mode: "0644"
    backup: true
  when: specialist_teacher_examples | length > 0
  register: specialist_examples_copy

# The voice loop reads the file when it starts.
- name: Restart the voice loop to read the new examples
  tags: [content, app, examples]
  become: true
  ansible.builtin.systemd:
    name: specialist-voice
    state: restarted
  when:
    - specialist_examples_copy is changed
    - specialist_voice_autostart | bool

# The module ships one index. Remove any other left by an earlier install, so the voice
# loop cannot pick a stale one and content under licences no longer used leaves the device.
# On this computer, in the module. (The fileglob lookup cannot match a wildcard folder,
# so it found no shipped index and this step never removed anything.)
- name: List the indexes this module ships
  tags: [content]
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../payload/corpus"
    patterns: manifest.json
    recurse: true
    depth: 3
  register: specialist_payload_indexes

- name: Find installed indexes
  tags: [content]
  ansible.builtin.find:
    paths: "{{ specialist_root }}/corpus"
    file_type: directory
  register: specialist_installed_corpus

- name: Remove indexes this module does not ship
  tags: [content]
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ specialist_installed_corpus.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - specialist_shipped_indexes | length > 0
    - (item.path | basename) not in specialist_shipped_indexes
  vars:
    specialist_shipped_indexes: >-
      {{ specialist_payload_indexes.files | map(attribute='path')
         | select('search', '/index/manifest\.json$')
         | map('dirname') | map('dirname') | map('basename') | list }}

# ---------------------------------------------------------------------- verify
# The checks load every model again, so pause the voice loop to keep memory free.
- name: Pause the voice loop during the checks
  tags: [verify]
  become: true
  ansible.builtin.systemd:
    name: specialist-voice
    state: stopped
  failed_when: false

- name: Wait for Ollama and Bhashini
  tags: [verify]
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    timeout: 300
  loop: [11434, 11400]

- name: Note when the checks start
  tags: [verify]
  ansible.builtin.command: date '+%Y-%m-%d %H:%M:%S'
  register: specialist_check_start
  changed_when: false

- name: Ask a question the corpus covers
  tags: [verify]
  ansible.builtin.command:
    argv: [/usr/local/bin/specialist-voice, --no-speak, --text, "{{ specialist_verify_question }}"]
  register: specialist_check_answer
  changed_when: false
  failed_when: "'DIKSHA' not in specialist_check_answer.stdout"

- name: Ask a question the corpus does not cover
  tags: [verify]
  ansible.builtin.command:
    argv: [/usr/local/bin/specialist-voice, --no-speak, --text, "Who won the cricket world cup?"]
  register: specialist_check_refusal
  changed_when: false
  failed_when: "'REFUSED' not in specialist_check_refusal.stdout"

- name: Ask for an answer in Hindi
  tags: [verify]
  ansible.builtin.command:
    argv: [/usr/local/bin/specialist-voice, --no-speak, --out-lang, hi, --text, "{{ specialist_verify_question }}"]
  register: specialist_check_hindi
  changed_when: false
  failed_when: specialist_check_hindi.stdout is not search('[ऀ-ॿ]')

- name: Check the CTranslate2 build and the Tesseract language packs
  tags: [verify]
  ansible.builtin.shell: |
    {{ specialist_bhashini_dir }}/venv/bin/python -c "import ctranslate2 as c; print('CTranslate2', c.__version__, c.get_supported_compute_types('cuda'))"
    tesseract --list-langs | tail -n +2 | tr '\n' ' '
  register: specialist_check_tools
  changed_when: false

# Ollama cuts a prompt that does not fit its context, which would change the answer
# without an error. This catches it if a code change makes prompts longer than
# OLLAMA_CONTEXT_LENGTH in specialist_ollama_env allows.
- name: Look for prompts Ollama had to cut during the checks
  tags: [verify]
  become: true
  ansible.builtin.shell: >-
    journalctl -u ollama --since "{{ specialist_check_start.stdout }}" --no-pager
    | grep -ci "truncating input" || true
  register: specialist_check_truncation
  changed_when: false

- name: Check that every prompt fitted the answer model's context
  tags: [verify]
  ansible.builtin.assert:
    that: specialist_check_truncation.stdout | int == 0
    fail_msg: >-
      Ollama cut {{ specialist_check_truncation.stdout }} prompt(s) to fit its context, which
      changes answers. Raise OLLAMA_CONTEXT_LENGTH in specialist_ollama_env and run --tags boot,verify.
    quiet: true

# Taken before the voice loop starts again, with Ollama and Bhashini loaded.
- name: Measure memory
  tags: [verify]
  ansible.builtin.shell: |
    awk '/MemAvailable/ {printf "Memory available with the voice loop paused: %d MB\n", $2/1024}' /proc/meminfo
    echo "Boot target: $(systemctl get-default)"
    /usr/local/bin/ollama ps | tail -n +2 | awk '{print "Loaded in Ollama: " $0}'
    echo "Ollama models on disk: $(/usr/local/bin/ollama list | tail -n +2 | awk '{print $1}' | tr '\n' ' ')"
  register: specialist_check_memory
  changed_when: false

- name: Restart the voice loop
  tags: [verify]
  become: true
  ansible.builtin.systemd:
    name: specialist-voice
    state: started
  when: specialist_voice_autostart | bool
  failed_when: false

- name: Show the results
  tags: [verify]
  ansible.builtin.debug:
    msg: >-
      {{ ['English: ' ~ (specialist_check_answer.stdout_lines | select('search', '^   · ') | first),
          'Refusal: ' ~ (specialist_check_refusal.stdout_lines | select('search', 'REFUSED') | first),
          'Hindi: ' ~ (specialist_check_hindi.stdout_lines | select('search', '^   · ') | first),
          specialist_check_tools.stdout]
         + specialist_check_memory.stdout_lines }}
