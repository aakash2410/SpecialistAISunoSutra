---
# The Specialist: deployment variables.
# Override any of these in the inventory or with -e on the command line.

# Who owns and runs everything. Defaults to the account Ansible connects as.
specialist_user: "{{ ansible_user | default(ansible_user_id) }}"

# Everything The Specialist installs lives here.
specialist_root: /opt/specialist
specialist_venv: "{{ specialist_root }}/venv"
specialist_bhashini_dir: "{{ specialist_root }}/bhashini_models"
# Point this at an existing folder to reuse files you have already downloaded.
specialist_assets_dir: "{{ specialist_root }}/assets"

# Answer model. Replace this with the fine-tuned model once it exists.
specialist_llm_model: qwen2.5:1.5b

# English speech input. Hindi goes through Bhashini.
specialist_whisper_model: tiny.en

# Model folders the pipeline code loads from {{ specialist_root }}/models. The install
# removes any other folder there, left by an earlier install, and never removes these.
specialist_models_in_use:
  - multilingual-e5-small-onnx   # retrieval (pocketinfer/models/embed.py)
  - nli-deberta-v3-base-onnx     # answer check (pocketinfer/models/verify.py)
  - nli-safety-onnx              # safety check (pocketinfer/specialist/safety.py)
  - lang-id-ecapa-onnx           # spoken language ID (pocketinfer/models/langid.py)
  - whisper                      # English speech input (pocketinfer/models/whisper.py)

# ------------------------------------------------------------------------ memory
# Ollama server settings, added as a systemd drop-in so they apply whoever installed the
# Ollama unit. One model loaded and one request at a time, which is all the voice loop
# sends. The longest grounded prompt is about 1,100 tokens (three passages of at most
# about 1,300 characters each) plus 128 to answer, so 2048 tokens of context fit it with
# room to spare and use half the memory of Ollama's usual 4096. The verify tag fails if
# Ollama ever had to cut a prompt to fit.
specialist_ollama_env:
  OLLAMA_MAX_LOADED_MODELS: "1"
  OLLAMA_NUM_PARALLEL: "1"
  OLLAMA_CONTEXT_LENGTH: "2048"

# glibc memory arenas for the voice loop and Bhashini. Both are multi-threaded Python
# processes, and glibc's default of up to 8 arenas per core holds freed memory that
# never goes back. 2 keeps less of it. Answers do not change. Set "" for glibc's default.
specialist_malloc_arena_max: "2"

# Boot to the text console instead of the desktop, which frees the memory the desktop
# holds (about 800 MB on JetPack 6). Off by default: the role never changes this on its
# own. Takes effect at the next reboot. Undo with: sudo systemctl set-default graphical.target
specialist_headless: false

# Delete every Ollama model except specialist_llm_model, for example ones the Suno Sutra
# base install pulled. They take disk, not memory, unless something asks for them. Off by
# default, because other software on the device may use them.
specialist_prune_ollama_models: false

# Tesseract language packs for reading textbook pages.
specialist_ocr_packs: [hin]

# Package index for the Jetson builds of Bhashini's Python packages.
specialist_torch_index: https://pypi.jetson-ai-lab.io/jp6/cu126
# Package index for the CPU build of PyTorch, which Bhashini uses for speech input.
specialist_torch_cpu_index: https://download.pytorch.org/whl/cpu

# Hardware used by the voice loop. Change these when the microphone or speaker changes.
# ALSA card names stay the same across reboots, unlike card numbers.
specialist_mic_device: plughw:CARD=Arducam8mp,DEV=0
specialist_speaker_device: plughw:CARD=UACDemoV10,DEV=0
# The USB camera, from lsusb.
specialist_camera_vendor: "0c45"
specialist_camera_product: "6366"

# Free disk space required before installing, in GB.
specialist_min_free_gb: 15

# A teacher's filled-in everyday examples file, from data/teacher_examples.txt. Leave empty
# to keep the file already on the device. Set it to install a returned file, which replaces
# the one there (the old one is kept as a backup):
#   -e specialist_teacher_examples=/path/to/teacher_examples.txt --tags examples
specialist_teacher_examples: ""

# A question the installed corpus covers, used by the final checks.
specialist_verify_question: What is photosynthesis?

# The voice loop starts at boot and listens for the talk button. Set to false to run it
# only by hand with specialist-voice, for example while testing.
specialist_voice_autostart: true
# auto works out the language of each question and answers in it. Set hi or en to fix it.
specialist_voice_in_lang: auto
specialist_voice_out_lang: auto
# What starts and stops recording: key (any USB keyboard or keypad, Enter) or gpio (touch
# sensor on the 40-pin header). For gpio, set the chip and line that gpioinfo shows for the
# pin the sensor's signal is wired to.
specialist_trigger: key
specialist_gpio_chip: ""
specialist_gpio_line: ""
# The 2.8 inch touch screen (local/screen.py). Opt-in: -e specialist_screen=true --tags screen.
# It shows the state, the question and the answer, and a tap on it works as the talk button
# too. Turn on spi1 with jetson-io first (see module/README.md). Rotation is 90 or 270 for
# landscape; use the other one if the text is upside down.
specialist_screen: false
specialist_screen_rotation: 90
# A teacher can say "switch off" (or "बंद हो जाओ"), then yes, and the device shuts down
# cleanly. This lets the voice loop's user run exactly "systemctl poweroff" through sudo
# without a password (/etc/sudoers.d/specialist-poweroff). Set to false to turn it off;
# the device then says it is switching off but stays on.
specialist_voice_poweroff: true
