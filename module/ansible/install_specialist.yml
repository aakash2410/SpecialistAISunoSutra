---
# Install The Specialist on a Jetson running JetPack 6.
#
#   cp inventory.ini.sample inventory.ini     # adjust for your device
#   ansible-playbook -i inventory.ini install_specialist.yml -K
#
# -K asks for the device's sudo password. Safe to re-run: finished steps are skipped.
#
# Tags: system | assets | ollama | bhashini | app | content | verify
#   ansible-playbook -i inventory.ini install_specialist.yml -K --tags content

- hosts: specialist
  roles:
    - specialist
